    <!-- Guard against third-party browser extension injection collisions (Keplr, Zerion, Taho, etc.) -->
    <script>
      (function() {
        var isExtensionError = function(e) {
          var msg = (e && (e.message || e.reason || (typeof e === 'string' ? e : ''))) + '';
          var filename = (e && e.filename) || '';
          var stack = (e && e.error && e.error.stack) || '';
          return (
            filename.indexOf('chrome-extension://') !== -1 ||
            stack.indexOf('chrome-extension://') !== -1 ||
            msg.indexOf('Keplr') !== -1 ||
            msg.indexOf('walletRouter') !== -1 ||
            msg.indexOf('isZerion') !== -1 ||
            msg.indexOf('Invalid method: ethereum') !== -1 ||
            msg.indexOf('Invalid method: starknet') !== -1
          );
        };

        window.addEventListener('error', function(event) {
          if (isExtensionError(event)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isExtensionError(event)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
