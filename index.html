    <!-- Shield against third-party Web3 extension collisions (Keplr, Zerion, Taho) -->
    <script>
      (function() {
        var isExtensionNoise = function(val) {
          if (!val) return false;
          var text = '';
          try {
            if (typeof val === 'string') {
              text = val;
            } else if (val.message || val.stack) {
              text = (val.message || '') + ' ' + (val.stack || '');
            } else {
              text = String(val);
            }
          } catch (e) {
            text = '';
          }
          return (
            text.indexOf('Keplr') !== -1 ||
            text.indexOf('gt-window-provider') !== -1 ||
            text.indexOf('chrome-extension://') !== -1 ||
            text.indexOf('walletRouter') !== -1 ||
            text.indexOf('isZerion') !== -1 ||
            text.indexOf('Invalid method: ethereum') !== -1 ||
            text.indexOf('Invalid method: starknet') !== -1
          );
        };

        // Filter extension noise from console.error
        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            if (isExtensionNoise(args[i])) return;
          }
          return originalConsoleError.apply(console, arguments);
        };

        // Filter extension noise from console.warn
        var originalConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            if (isExtensionNoise(args[i])) return;
          }
          return originalConsoleWarn.apply(console, arguments);
        };

        // Suppress unhandled extension window errors
        window.addEventListener('error', function(event) {
          if (
            isExtensionNoise(event.message) ||
            isExtensionNoise(event.filename) ||
            isExtensionNoise(event.error)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        // Suppress unhandled extension promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          if (isExtensionNoise(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
